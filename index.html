<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="color-scheme" content="dark"/>
<meta name="description" content="Eu tenho um ponto. Controle pessoal de jornada e banco de horas."/>
<title>Eu tenho um ponto</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Meu Ponto"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="app.css"/>
</head>
<body>
<div id="app" class="app-shell tf-app">
  <aside class="side-panel" aria-label="Navegação">
    <button id="homeBrand" class="brand brand-button" type="button" aria-label="Voltar ao início">
      <span class="tf-mark" aria-hidden="true">e.</span>
      <span class="tf-brand-copy">Eu tenho um ponto</span>
    </button>
    <nav id="bottomNav" class="bottom-nav" aria-label="Seções do aplicativo">
      <button type="button" data-tab="home" class="active"><span class="nav-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></span><span>Hoje</span></button>
      <button type="button" data-tab="register"><span class="nav-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span><span>Registrar</span></button>
      <button type="button" data-tab="month"><span class="nav-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span><span>Mês</span></button>
      <button type="button" data-tab="config"><span class="nav-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span><span>Ajustes</span></button>
    </nav>
  </aside>
  <div class="app-workspace">
    <header class="topbar">
      <button class="brand brand-button topbar-brand" type="button" aria-hidden="true" tabindex="-1" onclick="document.getElementById('homeBrand').click()"><span class="tf-mark">e.</span></button>
      <p id="modelBadge" class="topbar-context">v2.0.0</p>
      <button id="profileBtn" class="avatar" type="button" aria-label="Abrir perfil">P</button>
    </header>
    <main id="screen" class="tf-screen" aria-live="polite"></main>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="firebase-config.js"></script>
<script src="sync-core.js"></script>
<script src="app.js"></script>
</body>
</html>
