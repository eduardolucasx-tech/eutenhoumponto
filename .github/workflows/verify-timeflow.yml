name: Validar Timeflow

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Matrizes, nuvem e interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar regressões
        run: node --test tests/*.test.cjs
      - name: Verificar JavaScript
        run: for f in *.js; do node --check "$f" || exit 1; done
