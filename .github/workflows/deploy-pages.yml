name: Publicar Timeflow Black & Gold no GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout da versão publicada
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testar cálculos, ausências, importações e feriados
        run: node --test tests/*.test.cjs

      - name: Preparar arquivos estáticos
        run: |
          mkdir -p public
          cp index.html preview.html manifest.json icon.svg *.css *.js public/
          touch public/.nojekyll
          # Falha o deploy se a página referenciar um arquivo local que não foi copiado.
          for ref in $(grep -oE '(href|src)="[^"]+"' index.html | sed -E 's/^(href|src)="//; s/"$//' | grep -vE '^(https?:)?//'); do
            test -s "public/$ref" || { echo "Arquivo referenciado e ausente: $ref"; exit 1; }
          done

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
